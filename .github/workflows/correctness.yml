name: Native compression correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-compress
      - name: Read source pins
        id: pins
        shell: bash
        run: |
          echo "base=$(tr -d '\n' < luce-compress/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(tr -d '\n' < luce-compress/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap pinned compilers without modifying their sources
        working-directory: luce-compress
        run: python3 tools/bootstrap.py
      - name: All six compiler modes
        working-directory: luce-compress
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run.py 2>&1 | tee build/correctness.log
      - name: Memory safety instrumentation
        working-directory: luce-compress
        run: python3 tests/sanitize.py
      - name: Larger native streaming resource workloads
        working-directory: luce-compress
        shell: bash
        run: |
          set -o pipefail
          python3 tests/check_stress.py build/native3/stress-driver --full 2>&1 | tee build/resources.log
      - name: Extended independent oracles
        working-directory: luce-compress
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_large.py build/native3/file-driver --full 2>&1 | tee build/large-streams.log
          python3 tests/check_fuzz.py build/native3/fuzz-driver --seed 19510002 --cases 65536 2>&1 | tee build/fuzz.log
      - name: Package Linux test binaries
        if: runner.os == 'Linux'
        working-directory: luce-compress
        run: python3 tools/test_bundle.py --output build/luce-compress-smoke-x86_64-linux.tar.gz
      - name: Upload Linux test binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: luce-compress-smoke-x86_64-linux
          path: luce-compress/build/luce-compress-smoke-x86_64-linux.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-tests-${{ matrix.os }}
          path: |
            luce-compress/build/correctness.log
            luce-compress/build/resources.log
            luce-compress/build/large-streams.log
            luce-compress/build/fuzz.log
            luce-compress/build/fuzz-failures/
