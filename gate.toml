# What the gate runs on each platform (luce-base tools/gate.py, docs/CI.md): bash commands
# in this checkout, in order, beside its dependencies at main, with LUCE_BASE and LUCE
# naming the toolchain the gate built.
tools = ["luce"]

[macos]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    # Google's Brotli decoder as an independent oracle
    "python3 -m venv build/test-env && build/test-env/bin/python -m pip install -q --disable-pip-version-check brotli",
    "build/test-env/bin/python tests/run.py",
]
full = [
    "python3 tests/sanitize.py",
    # larger native streaming workloads and the extended independent oracles
    "python3 tests/check_stress.py build/native3/stress-driver --full",
    "build/test-env/bin/python tests/check_large.py build/native3/file-driver --full",
    "build/test-env/bin/python tests/check_fuzz.py build/native3/fuzz-driver --seed 19510002 --cases 65536",
]

[linux]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python3 -m venv build/test-env && build/test-env/bin/python -m pip install -q --disable-pip-version-check brotli",
    "build/test-env/bin/python tests/run.py",
]
full = [
    "python3 tests/sanitize.py",
    "python3 tests/check_stress.py build/native3/stress-driver --full",
    "build/test-env/bin/python tests/check_large.py build/native3/file-driver --full",
    "build/test-env/bin/python tests/check_fuzz.py build/native3/fuzz-driver --seed 19510002 --cases 65536",
]

[windows]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python -m venv build/test-env && build/test-env/Scripts/python -m pip install -q --disable-pip-version-check brotli",
    "build/test-env/Scripts/python tests/run.py",
]
